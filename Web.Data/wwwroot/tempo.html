<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Monitoramento dos Rios</title>

    <style>
        /* ============================================================
           CORES DA LUZ DO DIA
           Usadas no fundo sólido e nos dois gradientes de virada.
           ============================================================ */
        :root {
            --cor-dia: rgb(145, 182, 220);
            --cor-noite: rgb(34, 63, 84);
        }

        /* ============================================================
           PÁGINA
           ============================================================ */
        body {
            background-color: gainsboro;
        }

        .titulo-previsao {
            text-align: center;
        }

        #previsaoCards {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rodape-coleta {
            text-align: center;
            margin-top: 10px;
        }

        .erro-previsao {
            text-align: center;
            color: red;
            font-size: 1.2em;
        }

        /* ============================================================
           CARD DE UM DIA
           ============================================================ */
        .date-card {
            font-size: 14px;
        }

            .date-card h3 {
                color: black;
                text-align: center;
                margin-bottom: 12px;
                font-weight: bold;
            }

        .mini-cards-row {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            border: solid 2px black;
            border-radius: 5px;
        }

            .mini-cards-row::-webkit-scrollbar {
                background-color: transparent;
            }

        /* ============================================================
           MINI-CARD DE UMA HORA
           A largura é geometria calculada a partir da tela: o JS publica
           --mini-card-largura e o CSS decide o que fazer com ela.
           ============================================================ */
        .mini-card {
            width: var(--mini-card-largura, 40px);
            text-align: center;
            font-size: 0.85em;
        }

            .mini-card .time {
                /*font-weight: bold;*/
                margin-bottom: 4px;
                font-size: unset;
            }

        .mini-card .temp {
            font-size: 1.1em;
            color: brown;
            margin: 4px 0;
        }

        .mini-card .wind {
            margin: 2px 0;
            color: darkgreen;
        }

        .mini-card .wind.vento-forte {
            color: red;
        }

        .mini-card .precip {
            margin: 2px 0;
            color: navy;
        }

        .mini-card img {
            height: 20px;
            margin: 4px 0;
        }

        /* ============================================================
           LUZ DO DIA
           Fundo do mini-card (só ele) e cor dos textos de dentro.
           ============================================================ */
        .mini-card.isDay {
            background: var(--cor-dia);
        }

        .mini-card.isNight {
            background: var(--cor-noite);
        }

        .mini-card.isTransition.para-dia {
            background: linear-gradient(to right, var(--cor-noite), var(--cor-dia));
        }

        .mini-card.isTransition.para-noite {
            background: linear-gradient(to right, var(--cor-dia), var(--cor-noite));
        }

        .time.isNight {
            color: white;
        }

        .temp.isNight {
            color: #d9534f;
        }

        .temp.isTransition {
            color: coral;
        }

        .wind.isNight {
            color: darkseagreen;
        }

        .wind.isTransition {
            color: palegreen;
        }

        .precip.isNight {
            color: cornflowerblue;
        }

        /* ============================================================
           TELA ESTREITA
           ============================================================ */
        @media(max-width: 900px) {
            .mini-card .time {
                font-size: large;
            }
        }
    </style>
</head>
<body>
    <script>
        /* ============================================================
           CONSTANTES
           ============================================================ */
        const URL_PREVISAO = '/weather/ext';
        const LARGURA_TELA_GRANDE = 900;    // Sincronizar com MEDIA
        const LARGURA_TELA_ESTREITA = 400;
        const VENTO_MIN_EXIBIR = 6;         // km/h - abaixo disso não mostra a linha de vento
        const VENTO_FORTE = 30;             // km/h - destaca em vermelho
        const HORAS_JA_ESCURAS = ["19h", "20h", "21h"]; // a API ainda diz "dia" mas na serra já escureceu

        /* ============================================================
           UTILITÁRIOS
           ============================================================ */
        function telaGrande() {
            return self.innerWidth > LARGURA_TELA_GRANDE;
        }

        function horaLocalFormatada(forecastUTC) {
            const date = new Date(forecastUTC + 'Z');
            return date.toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' }).replace(":00", "h");
        }

        /* ============================================================
           DADOS
           ============================================================ */
        function carregaWeather() {
            fetch(URL_PREVISAO)
                .then(response => response.json())
                .then(renderPrevisao)
                .catch(error => {
                    console.error('Erro ao buscar previsão:', error);
                    mostraErroPrevisao();
                });
        }

        // Agrupar dados por dia
        function agrupaPorDia(data) {
            return data.reduce((acc, item) => {
                const date = new Date(item.forecastUTC + 'Z');
                const dayKey = date.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' });
                if (!acc[dayKey]) acc[dayKey] = [];
                acc[dayKey].push(item);
                return acc;
            }, {});
        }

        /* ============================================================
           GEOMETRIA - quantas horas cabem na tela e com que largura
           ============================================================ */
        function larguraMiniCardPx() {
            if (telaGrande()) return (self.innerWidth / 24) - 2;
            if (self.innerWidth < LARGURA_TELA_ESTREITA) return (self.innerWidth / 8) - 3;
            return (self.innerWidth / 12) - 3;
        }

        function deveExibirHora(index) {
            if (telaGrande()) return true;
            if (index % 2 == 1) return false;
            if (self.innerWidth < LARGURA_TELA_ESTREITA && index % 3 == 1) return false; // 2/3
            return true;
        }

        /* ============================================================
           LUZ DO DIA
           ============================================================ */
        // Corrige a luz do dia informada pela API. A alteração no item é
        // proposital: o mini-card seguinte compara com este para achar a virada.
        function corrigeLuzDia(item, dataHora) {
            if (item.luzDia && HORAS_JA_ESCURAS.includes(dataHora)) item.luzDia = false;
        }

        // Classe dos textos e classes de fundo do mini-card.
        function classesLuzDia(item, itemAnterior) {
            const isTransition = itemAnterior && itemAnterior.luzDia !== item.luzDia;
            if (isTransition) {
                // Gradiente na virada; o sentido depende de amanhecer ou anoitecer
                return { texto: 'isTransition', fundo: ['isTransition', item.luzDia ? 'para-dia' : 'para-noite'] };
            }

            // Cor sólida
            const classe = item.luzDia ? 'isDay' : 'isNight';
            return { texto: classe, fundo: [classe] };
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function tagTemperatura(item, classeLuz) {
            const strTemp = item.temperatura < 10 ? item.temperatura.toFixed(1) : item.temperatura.toFixed(0);
            return `<div class="temp ${classeLuz}">${strTemp}°C</div>`;
        }

        function tagVento(item, classeLuz) {
            if (item.ventoVelocidade <= VENTO_MIN_EXIBIR) return '';
            const classeForca = item.ventoVelocidade > VENTO_FORTE ? 'vento-forte' : '';
            return `<div class="wind ${classeForca} ${classeLuz}"><i class="bi bi-wind"></i> ${item.ventoVelocidade.toFixed(0)} km/h</div>`;
        }

        // Ícone pictográfico
        function tagPicto(item) {
            if (!(item.pictoCode > 0)) return '';
            const strCode = item.pictoCode.toFixed(0).padStart(2, '0');
            return `<div><img src="/picto/${strCode}_${item.luzDia ? 'day' : 'night'}.svg" alt="Weather icon" /></div>`;
        }

        function criaMiniCard(item, itemAnterior, dataHora, larguraPx) {
            const miniCard = document.createElement('div');
            miniCard.className = 'mini-card';
            // Geometria vinda da tela, não estilo: o CSS consome a variável
            miniCard.style.setProperty('--mini-card-largura', larguraPx + 'px');

            const classes = classesLuzDia(item, itemAnterior);
            miniCard.classList.add(...classes.fundo);

            miniCard.innerHTML = `
                <div class="time ${classes.texto}">${dataHora}</div>
                ${tagPicto(item)}
                ${tagTemperatura(item, classes.texto)}
                <div class="precip ${classes.texto}">${item.precipitacao.toFixed(1)} mm</div>
                ${tagVento(item, classes.texto)}
            `;
            return miniCard;
        }

        function criaCardDia(dia, itens, ehPrimeiroDia, ehUltimoDia) {
            const card = document.createElement('div');
            card.className = 'date-card';
            card.innerHTML = `<h3>${dia}</h3>`;
            if (ehPrimeiroDia) card.classList.add('inicioDia');
            if (ehUltimoDia) card.classList.add('fimDia');

            const linhaHoras = document.createElement('div');
            linhaHoras.className = 'mini-cards-row';
            const larguraPx = larguraMiniCardPx();

            // Criar mini-cards para cada hora
            itens.forEach((item, index) => {
                if (!deveExibirHora(index)) return;
                const dataHora = horaLocalFormatada(item.forecastUTC);
                corrigeLuzDia(item, dataHora);
                linhaHoras.appendChild(criaMiniCard(item, itens[index - 1], dataHora, larguraPx));
            });

            card.appendChild(linhaHoras);
            return card;
        }

        function atualizaRodapeColeta(data) {
            if (data.length === 0) return;
            const dataHora = new Date(data[0].coletaUTC + 'Z').toLocaleString('pt-BR');
            const spanDH = document.querySelector('#dataHoraColetaPrevisao');
            spanDH.textContent = `Coleta dos Dados: ${dataHora} | Latitude: ${data[0].lat} / Longitude: ${data[0].lon}`;
        }

        function renderPrevisao(data) {
            // Criar cards visuais
            const cardsContainer = document.querySelector('#previsaoCards');
            cardsContainer.innerHTML = ''; // Limpar container

            atualizaRodapeColeta(data);

            // Criar um card para cada dia
            const porDia = agrupaPorDia(data);
            const dias = Object.keys(porDia);
            dias.forEach(dia => {
                const card = criaCardDia(dia, porDia[dia], dia === dias[0], dia === dias[dias.length - 1]);
                cardsContainer.appendChild(card);
            });
        }

        function mostraErroPrevisao() {
            document.querySelector('#previsaoTempo').innerHTML = '<p class="erro-previsao">Erro ao carregar previsão do tempo.</p>';
        }

        /* ============================================================
           EVENTOS / INIT
           ============================================================ */
        function recarregaAoGirarTela() {
            // girou a tela, recarrega pois tem mais espaço
            carregaWeather();
        }

        carregaWeather();
        window.screen.orientation.addEventListener('change', recarregaAoGirarTela);
    </script>

    <h2 class="titulo-previsao"> Previsão do Tempo</h2>
    <div id="previsaoTempo">
        <div id="previsaoCards"></div>
        <div class="rodape-coleta"> <small id="dataHoraColetaPrevisao"></small> </div>
    </div>

</body>
</html>

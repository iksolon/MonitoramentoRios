<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sistema de Monitoramento dos Rios</title>

    <!-- ============================================================
         COMPORTAMENTO
         Esta página não mostra nada: ela só escolhe o destino e vai.
         ============================================================ -->
    <script>
        /* ---------- Destino ---------- */
        function paginaInicialDoDominio(dominio) {
            if (dominio.includes("bitcoineaqui")) {
                console.log("BitcoinEAqui>RSRL");
                return "serra.html";
            }

            // default
            console.log("DEF>RSRL");
            return "serra.html";
        }

        /* ---------- Redirecionamento ---------- */
        function redirecionaParaPaginaInicial() {
            const dominio = window.location.hostname;
            console.log(dominio);
            window.location.href = paginaInicialDoDominio(dominio);
        }

        /* ---------- Init ---------- */
        redirecionaParaPaginaInicial();
    </script>

    <!-- ============================================================
         APARÊNCIA
         Tela de espera que aparece durante o redirecionamento.
         ============================================================ -->
    <style>
        /* --- Página --- */
        .tela-espera {
            background-color: darkslategray;
        }

        /* --- Área central --- */
        .content {
            height: 300px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* --- Indicador de carregamento --- */
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid #FFF;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="tela-espera">
    <div class="content">
        <span class="loader"></span>
    </div>
</body>
</html>

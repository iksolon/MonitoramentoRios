<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa das Estações</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="chart.js"></script>
    <script type="text/javascript" src="helpers.js"></script>

    <style>
        /* ============================================================
           LAYOUT DA TELA
           ============================================================ */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            /*color: white;*/
            /*background-color: darkslategray;*/
        }

        #screen {
            height: 100%;
            width: 100%;
            display: flex;
        }

        .left {
            height: 100%;
            width: 70%;
            overflow: hidden;
        }

        .right {
            width: 29%;
            overflow-y: scroll;
            overflow-x: hidden;
        }

        #map {
            height: 90%;
            width: 100%;
            min-width: 350px;
        }

        #charts {
            height: 100%;
            width: 100%;
        }

        /* ============================================================
           BOLHA DA ESTAÇÃO NO MAPA
           ============================================================ */
        .circle-label {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 123, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            border: 2px solid #007bff;
            line-height: 0.85;
        }

        /* Estação de fora da nossa rede */
        .estEX {
            border: 2px solid darkslategray;
            background: rgba(118, 118, 65, 0.5);
        }

        .bubble-data {
            display: flex;
            flex-direction: column;
        }

        /* ============================================================
           LEGENDA DOS GRÁFICOS
           A cor de cada estação vem da paleta no JS: é dado, e chega
           aqui pela variável --cor-estacao.
           ============================================================ */
        .legend-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
            flex-direction: row;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 10px;
            font-size: 0.9em;
        }

        .legend-color {
            border-radius: 10px;
            width: 20px;
            height: 15px;
            display: inline-block;
            margin-right: 5px;
            background-color: var(--cor-estacao);
        }
    </style>

</head>
<body>

    <div id="screen">
        <div class="left">
            <div id="map"> </div>
            <div id="legends" class="legend-container"> </div>
        </div>
        <div class="right">
            <div id="charts"> </div>
        </div>
    </div>

    <script>
        /* ============================================================
           CONSTANTES
           ============================================================ */
        const TAMANHO_BOLHA = 60;
        const HORAS_HISTORICO = 36;
        const URL_ULTIMOS = '/estacoes/ultimos';
        const URL_HISTORICO = '/estacoes/lastHourly';

        const SVG_SEM_SINAL = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#5f6368"><path d="M790-56 414-434q-47 11-87.5 33T254-346l-84-86q32-32 69-56t79-42l-90-90q-41 21-76.5 46.5T84-516L0-602q32-32 66.5-57.5T140-708l-84-84 56-56 736 736-58 56Zm-310-64q-42 0-71-29.5T380-220q0-42 29-71t71-29q42 0 71 29t29 71q0 41-29 70.5T480-120Zm236-238-29-29-29-29-144-144q81 8 151.5 41T790-432l-74 74Zm160-158q-77-77-178.5-120.5T480-680q-21 0-40.5 1.5T400-674L298-776q44-12 89.5-18t92.5-6q142 0 265 53t215 145l-84 86Z"/></svg>';

        const METRICAS = [
            { name: 'Temperatura (°C)', key: 'temperatura', unit: '°C' },
            { name: 'Umidade (%)', key: 'umidade', unit: '%' },
            { name: 'Pressão (hPa)', key: 'pressao', unit: 'hPa' },
            { name: 'Precipitação (mm)', key: 'precipitacao', unit: 'mm' },
            { name: 'Nível do Rio (m)', key: 'nivelRio', unit: 'm' }
        ];

        const CORES_ESTACOES = [
            'rgba(255, 99, 132, 0.8)',  // Vermelho
            'rgba(54, 162, 235, 0.8)',  // Azul
            'rgba(255, 206, 86, 0.8)',   // Amarelo
            'rgba(75, 192, 192, 0.8)',   // Ciano
            'rgba(153, 102, 255, 0.8)',  // Roxo
            'rgba(255, 159, 64, 0.8)',   // Laranja
            'rgba(0, 128, 0, 0.8)',      // Verde
            'rgba(255, 0, 255, 0.8)',    // Magenta
            'rgba(128, 128, 128, 0.8)',  // Cinza
            'rgba(0, 255, 255, 0.8)',    // Ciano claro
            'rgba(255, 99, 71, 0.8)',    // Salmão
            'rgba(139, 69, 19, 0.8)',    // Marrom
            'rgba(0, 0, 128, 0.8)',      // Azul escuro
            'rgba(255, 215, 0, 0.8)',    // Dourado
            'rgba(128, 0, 128, 0.8)'     // Púrpura
        ];
        const CORES_CHARTJS = ['#3366CC', '#DC3912', '#FF9900', '#109618', '#990099', '#3B3EAC', '#0099C6', '#D47', '#6A0', '#B82E2E', '#316395', '#949', '#2A9', '#AA1', '#63C', '#E67300', '#8B0707', '#329262', '#5574A6', '#651067']

        function corDaEstacao(index) {
            return CORES_ESTACOES[index % CORES_ESTACOES.length];
        }

        /* ============================================================
           ESTADO
           ============================================================ */
        let lst = [];               // marcadores criados no mapa
        let ids = [];               // ids das estações, na ordem em que entraram
        const stationNames = {};    // id -> nome amigável, vem do fetch dos últimos dados
        let map;

        /* ============================================================
           MAPA
           ============================================================ */
        function criaMapa() {
            const m = L.map('map', {
                maxZoom: 15,
                minZoom: 11,
            }).setView([-29.59, -50.51], 12); // Posição inicial [latitude, longitude] e zoom
            // Centro Rolante -29.61, -50.55
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(m);
            return m;
        }

        function adicionaEstacao(lat, lng, label, id, aClass) {
            ids.push(id);
            let baseClass = 'circle-label';
            if (aClass) baseClass = baseClass + ' ' + aClass;
            var circle = L.marker([lat, lng], {
                icon: L.divIcon({
                    className: baseClass,
                    html: label,
                    iconSize: [TAMANHO_BOLHA, TAMANHO_BOLHA],
                    iconAnchor: [20, 20] // Centralizar o texto no ponto
                })
            }).addTo(map);

            let url = `/live.html?estacao=${id}`
            if (url !== null) {
                circle.on('click', function () {
                    window.open(url, '_blank');
                });
            }

            circle.id = `mcE_${id}`;
            lst.push(circle);
        }

        function atualizaEstacao(label, id) {
            let e = lst.find(el => el.id === `mcE_${id}`);
            if (e === null || e === undefined) return;
            e._icon.innerHTML = label;
        }

        // Todas as coordenadas devem ter apenas 2.5 casas decimais (terceira casa múltiplo de 5)
        function registraEstacoes() {
            // RS*
            adicionaEstacao(-29.565, -50.535, SVG_SEM_SINAL, "04109F675953A131"); // RSRL-BE01
            adicionaEstacao(-29.590, -50.565, SVG_SEM_SINAL, "9A6EE7B45495BB7F"); // RSRL-GLLS
            adicionaEstacao(-29.635, -50.545, SVG_SEM_SINAL, "BB45660B199C5677"); // RSRL-RB01
            adicionaEstacao(-29.650, -50.545, SVG_SEM_SINAL, "5BA69743261D364A"); // RSFP-RB02
            adicionaEstacao(-29.565, -50.420, SVG_SEM_SINAL, "48B1162D47EC0FE6"); // RSRZ-CH01
            adicionaEstacao(-29.650, -50.575, SVG_SEM_SINAL, "80500E0214FFDAF4"); // RSRL-CE01
            adicionaEstacao(-29.640, -50.530, SVG_SEM_SINAL, "CF98FCFA7E9EE7C1"); // RSRL-AR01
            adicionaEstacao(-29.640, -50.560, SVG_SEM_SINAL, "2CAED8D9CB62CEB5"); // RSRL-BV01
            // EX*
            adicionaEstacao(-29.490, -50.570, SVG_SEM_SINAL, "D251E57DD415F69E", 'estEX'); // EXFP-AR01
            adicionaEstacao(-29.550, -50.570, SVG_SEM_SINAL, "936F7F3769D0B500", 'estEX'); // EXFP-IN01
            adicionaEstacao(-29.660, -50.625, SVG_SEM_SINAL, "726A95A4D3247CB4", 'estEX'); // EXFP-CP01
            adicionaEstacao(-29.500, -50.405, SVG_SEM_SINAL, "A954066DFFE75CEB", 'estEX'); // EXFP-RK01
            adicionaEstacao(-29.640, -50.460, SVG_SEM_SINAL, "91661F2504450922", 'estEX'); // EXRL-BV01
            adicionaEstacao(-29.590, -50.530, SVG_SEM_SINAL, "CEF2144E84EF82A0", 'estEX'); // EXRL-MG01
            adicionaEstacao(-29.575, -50.420, SVG_SEM_SINAL, "D01D80E734592AFB", 'estEX'); // EXRZ-CH01
        }

        /* ============================================================
           DADOS
           ============================================================ */
        // Puxa dados recentes para todas
        function carregaUltimosDados() {
            fetch(URL_ULTIMOS)
                .then(response => response.json())
                .then(data => {
                    data.forEach(dado => {
                        stationNames[dado.estacao] = dado.nomeEstacao;
                        atualizaEstacao(`<div class='bubble-data'>${textoDaBolha(dado)}<div>`, dado.estacao);
                    });
                })
                .catch(error => {
                    console.error('Erro ao carregar dados das estações:', error);
                });
        }

        function buscaHistoricoEstacoes(ids) {
            // Fazer fetch para cada estação
            const fetchPromises = ids.map(id =>
                fetch(`${URL_HISTORICO}?lastHours=${HORAS_HISTORICO}&estacao=${id}`)
                    .then(response => response.json())
                    .then(data => ({ id, data }))
                    .catch(error => {
                        console.error(`Erro ao buscar dados da estação ${id}:`, error);
                        return { id, data: [] };
                    })
            );

            // Aguardar todas as requisições
            return Promise.all(fetchPromises);
        }

        /* ============================================================
           CÁLCULO
           ============================================================ */
        function baldeDaHora() {
            return {
                labels: [], // Para armazenar os DateTime
                precipitacao: {},
                temperatura: {},
                umidade: {},
                pressao: {},
                nivelRio: {}
            };
        }

        function descartaLeiturasInvalidas(record) {
            if (record.nivelRio_AVG && record.nivelRio_AVG < 0) record.nivelRio_AVG = null; // <0m
            if (record.umidadeAr_AVG && record.umidadeAr_AVG < 5) record.umidadeAr_AVG = null; // <5%
        }

        // Organizar dados por HourKey
        function alinhaDadosPorHora(results) {
            const alignedData = {};
            results.forEach(result => {
                result.data.forEach(record => {
                    if (!record) return;
                    const hourKey = record.hourKey;
                    if (!alignedData[hourKey]) alignedData[hourKey] = baldeDaHora();

                    descartaLeiturasInvalidas(record);

                    if (!record.dataHoraDadosUTC.endsWith('Z')) record.dataHoraDadosUTC = record.dataHoraDadosUTC + 'Z';

                    alignedData[hourKey].labels.push(new Date(record.dataHoraDadosUTC).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }));
                    alignedData[hourKey].precipitacao[result.id] = record.precipitacaoTotal_Hora ?? null;
                    alignedData[hourKey].temperatura[result.id] = record.temperaturaAr_AVG ?? null;
                    alignedData[hourKey].umidade[result.id] = record.umidadeAr_AVG ?? null;
                    alignedData[hourKey].pressao[result.id] = record.pressaoAr_AVG ?? null;
                    alignedData[hourKey].nivelRio[result.id] = record.nivelRio_AVG ?? null;
                });
            });
            return alignedData;
        }

        // Preparar datasets de uma métrica, uma linha por estação
        function datasetsDaMetrica(metric, ids, alignedData, sortedHourKeys) {
            return ids.map((id, index) => ({
                label: stationNames[id] || `Estação ${id}`,
                data: sortedHourKeys.map(hourKey => alignedData[hourKey][metric.key][id] ?? null),
                borderColor: corDaEstacao(index),
                backgroundColor: corDaEstacao(index).replace('0.8', '0.2'),
                fill: false,
                tension: 0.1,
                pointRadius: 1,
            }));
        }

        /* ============================================================
           RENDER
           ============================================================ */
        function textoDaBolha(dado) {
            const displayItems = [];

            if (dado.temperaturaAr !== null && dado.temperaturaAr !== undefined) {
                displayItems.push(`<span>${formatValue(dado.temperaturaAr, 1)}ºC</span>`);
            }
            if (dado.pressaoAr !== null && dado.pressaoAr !== undefined) {
                displayItems.push(`<span>${formatValue(dado.pressaoAr, 0)}hPa</span>`);
            }
            if (dado.precipitacao10min !== null && dado.precipitacao10min !== undefined) {
                let casas = 1;
                if (dado.precipitacao10min >= 10) casas = 0;
                displayItems.push(`<span><i class="bi-cloud-rain"></i> ${formatValue(dado.precipitacao10min, casas)}mm</span>`);
            }
            if (dado.nivelRio !== null && dado.nivelRio !== undefined) {
                displayItems.push(`<span><i class="bi-water"></i> ${formatValue(dado.nivelRio, 1)}m</span>`);
            }

            return displayItems.length > 0 ? displayItems.join(' ') : '-';
        }

        function criaGraficoMetrica(chartsDiv, metric, datasets, labels) {
            const canvas = document.createElement('canvas');
            chartsDiv.appendChild(canvas);

            new Chart(canvas, {
                type: 'line',
                data: {
                    labels,
                    datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: metric.name
                        },
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: metric.unit
                            },
                            beginAtZero: false
                        },
                        x: {
                            title: {
                                display: false,
                                text: 'Hora'
                            }
                        }
                    }
                }
            });
        }

        // Cria legenda: uma cor por estação, compartilhada por todos os gráficos
        function renderLegenda() {
            const legendDiv = document.getElementById('legends');
            legendDiv.innerHTML = '';

            Object.entries(stationNames).forEach(([id, name], index) => {
                const legendItem = document.createElement('div');
                legendItem.className = 'legend-item';

                const colorBox = document.createElement('span');
                colorBox.className = 'legend-color';
                colorBox.style.setProperty('--cor-estacao', corDaEstacao(index));

                const label = document.createElement('span');
                label.textContent = name || `Estação ${id}`;

                legendItem.appendChild(colorBox);
                legendItem.appendChild(label);
                legendDiv.appendChild(legendItem);
            });
        }

        // Um gráfico por métrica, todas as estações no mesmo eixo do tempo
        async function renderGraficosEstacoes(ids) {
            // Limpar a div charts
            const chartsDiv = document.getElementById('charts');
            chartsDiv.innerHTML = '';

            const results = await buscaHistoricoEstacoes(ids);
            const alignedData = alinhaDadosPorHora(results);

            // Ordenar HourKeys para garantir sequência temporal
            const sortedHourKeys = Object.keys(alignedData).sort((a, b) => parseInt(a) - parseInt(b));
            const labels = sortedHourKeys.map(hourKey => alignedData[hourKey].labels[0]);

            // Criar um gráfico para cada métrica
            METRICAS.forEach(metric => {
                criaGraficoMetrica(chartsDiv, metric, datasetsDaMetrica(metric, ids, alignedData, sortedHourKeys), labels);
            });

            renderLegenda();
        }

        /* ============================================================
           INIT
           ============================================================ */
        map = criaMapa();
        registraEstacoes();
        carregaUltimosDados();
        // Gera os gráficos
        renderGraficosEstacoes(ids);
    </script>
</body>
</html>

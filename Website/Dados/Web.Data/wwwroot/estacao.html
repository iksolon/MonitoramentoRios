<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>Dados da Estação</title>
    <style>
        /* ===================== TABELAS ===================== */
        table {
            border-collapse: collapse;
            margin-top: 20px;
            max-width: 1200px;
        }

        table, th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        /* ===================== ÍCONES ===================== */
        /* Marca a leitura que chegou por LoRa, ao lado da data */
        .iconeLora {
            height: 24px;
            margin-left: 4px;
            vertical-align: middle;
        }
    </style>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="helpers.js"></script>
</head>
<body>
    <a href="dados.html">Listar Todas</a>

    <h2>Dados da Estação <span id="nomeEstacao"></span></h2>

    <!-- Gráfico -->
    <div id="chart_div"></div>
    <div id="chartPress_div"></div>
    <div id="chartLevel_div"></div>
    <div id="chartBat_div"></div>

    <table id="dadosEstacao">
        <thead>
            <tr>
                <th>Recebido (UTC)</th>
                <th>Internos</th>
                <th>Reportado (UTC)</th>
                <th>Ar</th>
                <th>Água</th>
                <th>Sinal Conexão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="9">Carregando...</td>
            </tr>

            <!-- Dados serão preenchidos dinamicamente aqui -->
        </tbody>
    </table>
    <p>Veja mais em: <a href="https://github.com/RafaelEstevamReis/MonitoramentoRios" target="_blank">gh/MonitoramentoRios</a></p>

    <script>
        /* ===================== CONSTANTES ===================== */

        // Quantas leituras cruas a página desenha
        const LIMITE_LEITURAS = 300;
        // source == 3 significa que o dado chegou por LoRa, não por Wi-Fi
        const SOURCE_LORA = 3;
        const ICONE_LORA = "<img src='lora.svg' class='iconeLora'>";

        /* ===================== UTILITÁRIOS ===================== */

        function estacaoSelecionada() {
            return getQueryParam("estacao");
        }

        // A API devolve do mais novo para o mais velho; o gráfico lê ao contrário.
        // A primeira linha é o cabeçalho da série e fica onde está.
        function inverteMantendoCabecalho(serie) {
            return [serie[0]].concat(serie.slice(1).reverse());
        }

        /* ===================== CARGA DE DADOS ===================== */

        // Carregar gráfico após carregar os dados
        function carregaDadosEstacao() {
            fetch(`/estacoes/dados?limit=${LIMITE_LEITURAS}&estacao=` + estacaoSelecionada())
                //fetch('https://monitorarios.xyz/estacoes/dados?estacao=' + getQueryParam("estacao"), { mode: 'no-cors' })
                .then(response => response.json())
                .then(renderEstacao)
                .catch(error => {
                    console.error('Erro ao carregar dados das estações:', error);
                });
        }

        /* ===================== CÁLCULO ===================== */

        function criaAcumuladorSeries() {
            return {
                // Quais gráficos a estação tem dado para desenhar
                temTemp: false,
                temChuva: false,
                temNivel: false,
                temBat: false,
                temPress: false,
                // Acumulado anterior do pluviômetro, para tirar a chuva do intervalo
                precAnterior: null,
                temperatura: [
                    //['Data/Hora', 'Temperatura do Ar', 'Umidade do Ar']
                    [
                        { label: 'Data/Hora', type: 'string' },
                        { label: 'Temperatura do Ar', type: 'number' },
                        { label: 'Umidade do Ar', type: 'number' },
                    ]
                ],
                nivel: [['Data/Hora', 'Nível', 'Sensor Raw']],
                chuva: [['Data/Hora', 'Chuva']],
                pressao: [['Data/Hora', 'Pressão']],
                bateria: [['Data/Hora', 'v Bat', '% Bat']]
            };
        }

        // Adicionar dados ao gráfico, se existirem valores
        function acumulaLeituraNasSeries(acc, dado) {
            const hora = new Date(dado.dataHoraDadosUTC).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            if (dado.temperaturaAr || dado.umidadeAr) {
                acc.temperatura.push([hora, round(dado.temperaturaAr, 1), round(dado.umidadeAr, 0)]);
                acc.temTemp = true;
            }
            if (dado.precipitacao || dado.precipitacao == 0) {
                if (!acc.precAnterior) acc.precAnterior = dado.precipitacaoTotal;

                let diff = acc.precAnterior - dado.precipitacaoTotal;
                if (diff < 0) diff = 0; // reset

                acc.chuva.push([hora, round(diff, 2)]);

                acc.precAnterior = dado.precipitacaoTotal;
                acc.temChuva = true;
            }
            if (dado.nivelRio || dado.nivelRio_RAW) {
                acc.nivel.push([hora, round(dado.nivelRio, 2), round(dado.nivelRio_RAW, 2)]);
                acc.temNivel = true;
            }
            if (dado.tensaoBateria && dado.tensaoBateria > 0) { // Quando não tem, fica em 0v
                acc.bateria.push([hora, round(dado.tensaoBateria, 2), round(dado.percentBateria, 0)]);
                acc.temBat = true;
            }
            if (dado.pressaoAr) {
                acc.pressao.push([hora, round(dado.pressaoAr, 0)]);
                acc.temPress = true;
            }
        }

        // Uma passada nas leituras alimenta as cinco séries, já na ordem do gráfico
        function montaSeries(data) {
            const acc = criaAcumuladorSeries();
            data.forEach(dado => acumulaLeituraNasSeries(acc, dado));

            return {
                temTemp: acc.temTemp,
                temChuva: acc.temChuva,
                temNivel: acc.temNivel,
                temBat: acc.temBat,
                temPress: acc.temPress,
                temperatura: inverteMantendoCabecalho(acc.temperatura),
                nivel: inverteMantendoCabecalho(acc.nivel),
                chuva: inverteMantendoCabecalho(acc.chuva),
                pressao: inverteMantendoCabecalho(acc.pressao),
                bateria: inverteMantendoCabecalho(acc.bateria)
            };
        }

        /* ===================== RENDER ===================== */

        function renderEstacao(data) {
            const tableBody = document.querySelector('#dadosEstacao tbody');
            tableBody.innerHTML = "";

            document.getElementById('nomeEstacao').textContent = data[0].nomeEstacao;

            renderTabelaLeituras(tableBody, data);
            desenhaGraficos(montaSeries(data));
        }

        function renderTabelaLeituras(tableBody, data) {
            data.forEach(dado => tableBody.appendChild(montaLinhaLeitura(dado)));
        }

        function montaLinhaLeitura(dado) {
            let prec = '-mm/min';
            if (dado.precipitacao || dado.precipitacao == 0) prec = `${formatValue(dado.precipitacao, 1) || '-'}mm/min (AT ${formatValue(dado.precipitacaoTotal, 1)})`;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${new Date(dado.recebidoUTC).toLocaleString()}${dado.source == SOURCE_LORA ? ICONE_LORA : ''}</td>
                <td>${formatValue(dado.temperaturaInterna, 1)}ºC | ${formatValue(dado.tensaoBateria, 2)}v (${formatValue(dado.percentBateria, 0)}%)</td>
                <td>${new Date(dado.dataHoraDadosUTC).toLocaleString()}</td>
                <td>${formatValue(dado.temperaturaAr, 1)}ºC | ${formatValue(dado.umidadeAr, 0)}% | ${formatValue(dado.pressaoAr, 1)}hPa</td>
                <td>${prec} | ${formatValue(dado.nivelRio, 2) || '-'}m</td>
                <td>${wifiSignalToPercent(dado.forcaSinal)} (${dado.forcaSinal || '-'}dBm)</td>
                `;
            return row;
        }

        // Desenhar o gráfico
        // Estação de pluviômetro usa o espaço do nível para mostrar a chuva
        function desenhaGraficos(series) {
            google.charts.load('current', { 'packages': ['corechart'] });
            google.charts.setOnLoadCallback(() => {
                if (series.temTemp) drawChart(series.temperatura);
                if (series.temBat) drawChartDuplo(series.bateria, 'Bateria', 'chartBat_div', 'Tensão (v)', 'Percentual', true);
                if (series.temPress) drawChartSimples(series.pressao, 'Pressão (hPa)', 'chartPress_div', false);

                if (series.temChuva) {
                    drawChartSimples(series.chuva, 'Chuva (mm)', 'chartLevel_div', false);
                } else {
                    if (series.nivel.length > 2) {
                        drawChartDuplo(series.nivel, 'Nível', 'chartLevel_div', 'Nível (m)', 'Sensor Raw', false);

                    }
                }
            });

            if (!series.temNivel && !series.temChuva) document.getElementById("chartLevel_div").hidden = true;
        }

        function drawChart(chartData) {
            const data = google.visualization.arrayToDataTable(chartData);

            const options = {
                title: 'Temperatura do Ar e Umidade',
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: {
                    title: 'Horário',
                    format: 'HH:mm',  // Formato para exibir apenas as horas
                    gridlines: { count: 15 }  // Ajuste para quantidade de gridlines (opcional)
                },
                vAxes: {
                    0: { title: 'Temperatura (°C)' },
                    1: {
                        title: 'Umidade (%)',
                        viewWindow: {
                            max: 100,
                        }
                    }
                },
                series: {
                    0: { targetAxisIndex: 0 },  // Temperatura no eixo esquerdo
                    1: { targetAxisIndex: 1 }   // Umidade no eixo direito
                }
            };

            const chart = new google.visualization.LineChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }

        function drawChartDuplo(chartData, title, id, legend1, legend2, s2Percent) {
            const data = google.visualization.arrayToDataTable(chartData);

            const options = {
                title: title,
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: {
                    title: 'Horário',
                    format: 'HH:mm',  // Formato para exibir apenas as horas
                    gridlines: { count: 15 }  // Ajuste para quantidade de gridlines (opcional)
                },
                vAxes: {
                    0: { title: legend1 },
                    1: {
                        title: legend2,
                        viewWindow: !s2Percent ? {} : {
                            max: 100,
                            min: 0
                        }
                    }
                },
                series: {
                    0: { targetAxisIndex: 0 },
                    1: { targetAxisIndex: 1 }
                }
            };

            const chart = new google.visualization.LineChart(document.getElementById(id));
            chart.draw(data, options);
        }

        function drawChartSimples(chartData, title, id, graficoLinha) {
            const data = google.visualization.arrayToDataTable(chartData);

            const options = {
                title: title,
                curveType: 'function',
                legend: { position: 'bottom' },
                hAxis: {
                    title: 'Horário',
                    format: 'HH:mm',  // Formato para exibir apenas as horas
                    gridlines: { count: 15 }  // Ajuste para quantidade de gridlines (opcional)
                },
                vAxes: {
                    0: { title: title },  // Eixo Y esquerdo
                },
                series: {
                    0: { targetAxisIndex: 0 },  // Temperatura no eixo esquerdo
                }
            };

            const chart = graficoLinha ? new google.visualization.LineChart(document.getElementById(id)) : new google.visualization.ColumnChart(document.getElementById(id));
            chart.draw(data, options);
        }

        /* ===================== EVENTOS / INIT ===================== */

        document.addEventListener("DOMContentLoaded", carregaDadosEstacao);
    </script>
</body>
</html>
